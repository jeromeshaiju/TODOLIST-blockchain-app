<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TDLOBC</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #fff8f0;
    --surface: #ffffff;
    --border: #f5c6d8;
    --accent: #f7a8c4;
    --accent2: #e8855a;
    --text: #3a2a2a;
    --muted: #b08080;
    --danger: #e84393;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 2rem 1rem;
    background-image: radial-gradient(ellipse at 20% 0%, #f7a8c430 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 100%, #ffe08a25 0%, transparent 50%);
  }

  header {
    max-width: 640px;
    margin: 0 auto 2.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .logo {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }

  #connectBtn {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    padding: 0.55rem 1.2rem;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  #connectBtn:hover { background: var(--accent); color: var(--bg); }
  #connectBtn.connected { border-color: #e8855a; color: #e8855a; }
  #connectBtn.connected:hover { background: #e8855a; color: #fff; }

  .wallet-info {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 0.25rem;
    text-align: right;
  }

  .card {
    max-width: 640px;
    margin: 0 auto 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
  }

  .card h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .input-row {
    display: flex;
    gap: 0.75rem;
  }

  input[type="text"] {
    flex: 1;
    background: #fff5f8;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 0.95rem;
    padding: 0.7rem 1rem;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: #f7a8c4; }
  input[type="text"]::placeholder { color: var(--muted); }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    padding: 0.7rem 1.2rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    font-weight: 700;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover:not(:disabled) { opacity: 0.85; }

  .btn-complete {
    background: transparent;
    border: 1px solid var(--accent2);
    color: var(--accent2);
    font-size: 0.7rem;
    padding: 0.35rem 0.8rem;
  }
  .btn-complete:hover:not(:disabled) { background: var(--accent2); color: #fff; }

  #taskList { list-style: none; display: flex; flex-direction: column; gap: 0.75rem; }

  .task-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.9rem 1rem;
    background: #fff5f8;
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: border-color 0.2s;
    animation: fadeIn 0.3s ease;
  }
  .task-item:hover { border-color: var(--border); }
  .task-item.done { opacity: 0.5; border-color: transparent; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .task-id {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    min-width: 24px;
  }

  .task-content {
    flex: 1;
    font-size: 0.95rem;
  }
  .task-item.done .task-content { text-decoration: line-through; color: var(--muted); }

  .done-badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 3px;
    padding: 0.2rem 0.5rem;
    letter-spacing: 1px;
  }

  .status {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    text-align: center;
    color: var(--muted);
    padding: 0.5rem;
  }
  .status.error { color: var(--danger); }
  .status.success { color: #d45b8a; }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 2rem 0;
  }

  .network-badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    background: #fff0f5;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
  }
  .network-badge .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 4px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">TDL<span>BCA</span></div>
    <span style="font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--muted);">TO DO List BlockChain Application</span>

    <div class="wallet-info" id="walletInfo">not connected</div>
  </div>
  <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
    <span style="font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--muted);">This project uses Sepolia testnet</span>
    <button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
  </div>
</header>

<div class="card">
  <h2>Add Task</h2>
  <div class="input-row">
    <input type="text" id="taskInput" placeholder="What needs to be done?" />
    <button class="btn btn-primary" onclick="addTask()" id="addBtn" disabled>Add</button>
  </div>
  <div class="status" id="txStatus"></div>
</div>

<div class="card">
  <h2>Tasks <span id="taskCount" style="color:var(--accent2)"></span></h2>
  <ul id="taskList"><div class="empty">Connect wallet to load tasks</div></ul>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script>
  const CONTRACT_ADDRESS = '0xE27578b90c7Ae8E3691Dc37e1aCD0da948D7BCb8';
  const ABI = [
    "function AddTask(string calldata content) public",
    "function completeTask(uint256 id) public",
    "function count() view returns (uint256)",
    "function list(uint256) view returns (string content, bool completed)",
    "event TaskCompleted(uint256 indexed id)"
  ];

  let provider, signer, contract;

  async function connectWallet() {
    if (!window.ethereum) return setStatus("MetaMask not found! Please install it.", "error");
    try {
      provider = new ethers.BrowserProvider(window.ethereum);
      await provider.send("eth_requestAccounts", []);

      const network = await provider.getNetwork();
      if (network.chainId !== 11155111n) {
        setStatus("Please switch to Sepolia testnet in MetaMask.", "error");
        return;
      }

      signer = await provider.getSigner();
      contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);

      const addr = await signer.getAddress();
      document.getElementById("walletInfo").textContent = addr.slice(0,6) + "..." + addr.slice(-4);
      const btn = document.getElementById("connectBtn");
      btn.textContent = "Connected";
      btn.classList.add("connected");
      document.getElementById("addBtn").disabled = false;

      await loadTasks();
    } catch (e) {
      setStatus("Connection failed: " + e.message, "error");
    }
  }

  async function loadTasks() {
    const list = document.getElementById("taskList");
    list.innerHTML = '<div class="status">Loading tasks...</div>';
    try {
      const count = await contract.count();
      document.getElementById("taskCount").textContent = `(${count})`;
      if (count === 0n) {
        list.innerHTML = '<div class="empty">No tasks yet. Add one above!</div>';
        return;
      }
      list.innerHTML = "";
      for (let i = 0n; i < count; i++) {
        const task = await contract.list(i);
        list.appendChild(makeTaskEl(i, task.content, task.completed));
      }
    } catch (e) {
      list.innerHTML = `<div class="status error">Failed to load tasks.</div>`;
    }
  }

  function makeTaskEl(id, content, completed) {
    const li = document.createElement("li");
    li.className = "task-item" + (completed ? " done" : "");
    li.id = "task-" + id;
    li.innerHTML = `
      <span class="task-id">#${id}</span>
      <span class="task-content">${escHtml(content)}</span>
      ${completed
        ? '<span class="done-badge">DONE</span>'
        : `<button class="btn btn-complete" onclick="completeTask(${id})">Complete</button>`}
    `;
    return li;
  }

  async function addTask() {
    const input = document.getElementById("taskInput");
    const content = input.value.trim();
    if (!content) return;
    setStatus("Sending transaction...", "");
    document.getElementById("addBtn").disabled = true;
    try {
      const tx = await contract.AddTask(content);
      setStatus("Waiting for confirmation...", "");
      await tx.wait();
      input.value = "";
      setStatus("Task added!", "success");
      await loadTasks();
    } catch (e) {
      setStatus(e.reason || e.message || "Transaction failed", "error");
    }
    document.getElementById("addBtn").disabled = false;
  }

  async function completeTask(id) {
    setStatus("Completing task #" + id + "...", "");
    try {
      const tx = await contract.completeTask(id);
      await tx.wait();
      setStatus("Task #" + id + " completed!", "success");
      await loadTasks();
    } catch (e) {
      setStatus(e.reason || e.message || "Transaction failed", "error");
    }
  }

  function setStatus(msg, type) {
    const el = document.getElementById("txStatus");
    el.textContent = msg;
    el.className = "status" + (type ? " " + type : "");
  }

  function escHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
</script>
</body>
</html>
